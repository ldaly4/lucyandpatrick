<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign up for a Christmas card from Lucy and Patrick, by post or by email.">
  <title>Christmas with Lucy &amp; Patrick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
  <link rel="stylesheet" href="styles.css?v=watercolour-snow">
  <script src="script.js?v=watercolour-snow" defer></script>
</head>
<body>
  <main>
    <div class="hearth">
      <div class="painting">
        <img class="room" src="images/fireplace.jpeg" srcset="images/fireplace-small.jpeg 540w, images/fireplace.jpeg 1086w" sizes="(min-aspect-ratio: 3/4) 75vh, 100vw" width="1086" height="1448" alt="Lucy’s hand-painted Christmas fireplace with four stockings, a garland and a gold-framed sign." fetchpriority="high">
        <div class="painting-lights" hidden aria-hidden="true">
          <div class="garland-glow"></div>
          <div class="fire">
            <img class="flame is-lit" src="images/flame-1.png" width="256" height="172" alt="">
          </div>
          <div class="candles">
            <img class="candle-flame candle-left-outer" src="images/candle-flame.png" width="44" height="137" alt="" decoding="async">
            <img class="candle-flame candle-left-inner" src="images/candle-flame.png" width="44" height="137" alt="" decoding="async">
            <img class="candle-flame candle-right-inner" src="images/candle-flame.png" width="44" height="137" alt="" decoding="async">
            <img class="candle-flame candle-right-outer" src="images/candle-flame.png" width="44" height="137" alt="" decoding="async">
          </div>
        </div>
        <button class="painting-link" type="button" aria-haspopup="dialog" aria-controls="card-dialog" aria-label="Click here for a card. Sign up for a Christmas card."></button>
        <button class="snow-toggle" type="button" aria-label="Snowfall" aria-controls="snowfall" aria-pressed="false" title="Toggle snowfall"></button>
      </div>
      <div class="snowfall" id="snowfall" aria-hidden="true" hidden></div>
    </div>

    <dialog id="card-dialog" aria-label="Sign up for a Christmas card">
      <div class="dialog-controls">
        <button class="dialog-close" type="button" aria-label="Close Christmas card sign-up" autofocus>×</button>
      </div>
      <form id="postal-form" method="post" novalidate>
        <input type="hidden" name="type" value="letter">
        <div hidden><label>Leave blank <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <div class="postal-poster">
          <img src="images/postal-postcard.jpeg" width="1536" height="1024" alt="" loading="lazy">
          <div class="postal-field postal-name">
            <label for="letter-name"><span class="visually-hidden">Name(s)</span></label>
            <input id="letter-name" name="name" autocomplete="name" required maxlength="150" aria-describedby="letter-name-error">
          </div>
          <div class="postal-field postal-address">
            <label for="letter-address"><span class="visually-hidden">Full address</span></label>
            <textarea id="letter-address" name="full_address" autocomplete="street-address" required maxlength="800" aria-describedby="letter-address-error"></textarea>
          </div>
          <button class="postal-submit" type="submit"><span class="visually-hidden">Submit</span></button>
        </div>
        <div class="postal-notices">
          <p id="letter-name-error" aria-live="polite"></p>
          <p id="letter-address-error" aria-live="polite"></p>
          <p class="submit-status" role="status"></p>
        </div>
      </form>
      <img class="thanks" src="images/thank-you.jpeg" width="1199" height="1312" alt="Thank you! You’re on the list! We’ll send you a Christmas card in the post soon." loading="lazy" tabindex="-1" hidden>
    </dialog>
    <noscript><p>Enable JavaScript to sign up for a card.</p></noscript>
  </main>
</body>
</html>
